<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6558e8">
  <meta name="description" content="SchoolMate — удобное школьное расписание">
  <title>SchoolMate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#today" aria-label="SchoolMate — на главную">
        <span class="brand-mark" aria-hidden="true">🎒</span>
        <span>SchoolMate</span>
      </a>
      <div class="date-chip" id="header-date"></div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <a href="#today" data-route="today"><span aria-hidden="true">🏠</span><span>Сегодня</span></a>
      <a href="#schedule" data-route="schedule"><span aria-hidden="true">📅</span><span>Расписание</span></a>
      <a href="#settings" data-route="settings"><span aria-hidden="true">⚙️</span><span>Настройки</span></a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
